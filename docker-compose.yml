services:
  web:
    build: .
    container_name: ci3_web
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./:/var/www/html
    environment:
      TZ: Asia/Jakarta
    depends_on:
      - mysql
    networks:
      - ci3_network

  mysql:
    image: mysql:5.7
    container_name: ci3_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: GantiPasswordRoot123!
      MYSQL_DATABASE: db_perpustakaan
      MYSQL_USER: ci3user
      MYSQL_PASSWORD: GantiPasswordDB123!
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ci3_network

volumes:
  mysql_data:

networks:
  ci3_network:
    driver: bridge