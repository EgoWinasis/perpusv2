services:
  web:
    image: php:7.4-apache
    container_name: ci3_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./:/var/www/html
    environment:
      TZ: Asia/Jakarta
    command: >
      bash -c "a2enmod rewrite &&
      apache2-foreground"
    depends_on:
      - mysql
    networks:
      - ci3_network

  mysql:
    image: mysql:5.7
    container_name: ci3_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: GantiPasswordRoot
      MYSQL_DATABASE: db_perpustakaan
      MYSQL_USER: ci3user
      MYSQL_PASSWORD: GantiPasswordDatabase
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ci3_network

volumes:
  mysql_data:

networks:
  ci3_network:
    driver: bridge