
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci3_web
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      TZ: Asia/Jakarta
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ci3_network

  mysql:
    image: mysql:5.7
    container_name: ci3_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootBaru123!
      MYSQL_DATABASE: db_perpustakaan
      MYSQL_USER: ci3user
      MYSQL_PASSWORD: DBBaru123!
      TZ: Asia/Jakarta
    volumes:
      - perpustakaan_db_baru:/var/lib/mysql
    networks:
      - ci3_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootBaru123!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ci3_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ci3_mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    networks:
      - ci3_network

volumes:
  perpustakaan_db_baru:

networks:
  ci3_network:
    driver: bridge
